<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Журнал учета аварий</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 1.5rem 1rem;
            overflow: hidden;
        }

        h1 {
            color: #1e2b3c;
            font-weight: 400;
            letter-spacing: 1px;
            margin-bottom: 1.2rem;
            text-shadow: none;
            text-align: center;
            font-size: 1.4rem;
        }

        .stage {
            position: relative;
            width: 100%;
            max-width: 560px;
            height: 600px;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        .card {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 24px;
            padding: 1.6rem 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            background: linear-gradient(145deg, #2c3e50, #1e2b3c);
            border: 1px solid #3e5a6b;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
            color: #ecf0f1;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            will-change: transform, opacity;
            transition: none;
        }

        .card.fly-left {
            animation: flyLeft 0.55s cubic-bezier(0.55, 0.06, 0.68, 0.19) forwards;
        }

        @keyframes flyLeft {
            0% {
                transform: translateX(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateX(-140%) rotate(-8deg);
                opacity: 0;
            }
        }

        .card.slide-in {
            animation: slideIn 0.55s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }

        @keyframes slideIn {
            0% {
                transform: translateX(140%);
                opacity: 0;
            }
            100% {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .card-number {
            position: absolute;
            top: 12px;
            right: 18px;
            background: rgba(0, 0, 0, 0.4);
            color: #bdc3c7;
            font-size: 0.72rem;
            font-weight: 600;
            padding: 0.2rem 0.75rem;
            border-radius: 30px;
            letter-spacing: 0.5px;
            backdrop-filter: blur(4px);
        }

        .question-text {
            font-size: 0.98rem;
            line-height: 1.45;
            font-weight: 500;
            word-break: break-word;
            flex: 1 1 auto;
            display: flex;
            align-items: flex-start;
            text-align: left;
            padding: 0.9rem 1rem 0.9rem 1.1rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            border-left: 4px solid #3498db;
            margin-bottom: 0.7rem;
            overflow-y: auto;
            min-height: 0;
        }

        .answers {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            flex-shrink: 0;
        }

        .answer-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid #4a6a7f;
            color: #ecf0f1;
            padding: 0.75rem 1rem;
            border-radius: 16px;
            font-size: 0.86rem;
            font-weight: 400;
            text-align: left;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, transform 0.1s;
            word-break: break-word;
            line-height: 1.35;
            display: block;
            backdrop-filter: blur(4px);
            font-family: inherit;
            width: 100%;
        }

        .answer-btn:hover {
            background: rgba(52, 152, 219, 0.3);
            border-color: #3498db;
        }

        .answer-btn:active {
            transform: scale(0.98);
        }

        .answer-btn.correct-flash {
            background: rgba(46, 204, 113, 0.6);
            border-color: #2ecc71;
            transition: background 0.15s, border-color 0.15s;
        }

        .answer-btn.wrong-flash {
            background: rgba(231, 76, 60, 0.6);
            border-color: #e74c3c;
            animation: shake 0.35s ease;
            transition: background 0.15s, border-color 0.15s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        .progress {
            margin-top: 1.2rem;
            color: #1e2b3c;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            background: rgba(0, 0, 0, 0.08);
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
        }

        /* ===== Итоговая таблица ===== */
        .results-wrapper {
            width: 100%;
            max-width: 1000px;
            max-height: 92vh;
            overflow-y: auto;
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
        }

        .results-header {
            color: #1e2b3c;
            text-align: center;
            margin-bottom: 1.2rem;
        }

        .results-header .emoji {
            font-size: 3rem;
            display: block;
            margin-bottom: 0.5rem;
        }

        .results-header h2 {
            font-weight: 400;
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .results-summary {
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
            margin-top: 0.8rem;
            font-size: 1rem;
        }

        .results-summary span {
            background: rgba(0, 0, 0, 0.08);
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
        }

        .results-summary .good { color: #27ae60; font-weight: 600; }
        .results-summary .bad { color: #c0392b; font-weight: 600; }

        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(44, 62, 80, 0.06);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
            font-size: 0.85rem;
        }

        thead {
            background: rgba(0, 0, 0, 0.08);
        }

        th {
            color: #1e2b3c;
            text-align: left;
            padding: 0.9rem 0.8rem;
            font-weight: 600;
            font-size: 0.8rem;
            letter-spacing: 0.3px;
            border-bottom: 2px solid #3498db;
            vertical-align: top;
        }

        td {
            color: #2c3e50;
            padding: 0.8rem 0.8rem;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            vertical-align: top;
            line-height: 1.4;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr:nth-child(even) {
            background: rgba(0, 0, 0, 0.02);
        }

        .col-num {
            width: 44px;
            text-align: center;
            color: #7f8c8d;
            font-weight: 600;
        }

        .col-result {
            width: 110px;
            text-align: center;
            white-space: nowrap;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.7rem;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .badge-ok {
            background: rgba(46, 204, 113, 0.15);
            color: #27ae60;
            border: 1px solid rgba(46, 204, 113, 0.5);
        }

        .badge-fail {
            background: rgba(231, 76, 60, 0.15);
            color: #c0392b;
            border: 1px solid rgba(231, 76, 60, 0.5);
        }

        .chosen-correct { color: #27ae60; }
        .chosen-wrong { color: #c0392b; }

        .scroll-hint {
            color: #7f8c8d;
            font-size: 0.75rem;
            text-align: center;
            margin-top: 0.6rem;
        }

        /* ===== Кнопки действий ===== */
        .actions {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
            padding-bottom: 1rem;
        }

        .action-btn {
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            padding: 0.85rem 2rem;
            border-radius: 50px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s, background 0.2s, border-color 0.2s;
        }

        .action-btn:active {
            transform: scale(0.97);
        }

        .btn-retry {
            background: rgba(52, 152, 219, 0.9);
            color: #fff;
            border-color: #3498db;
            box-shadow: 0 8px 20px rgba(52, 152, 219, 0.35);
        }

        .btn-retry:hover {
            background: rgba(52, 152, 219, 1);
            box-shadow: 0 10px 24px rgba(52, 152, 219, 0.5);
        }

        .btn-finish {
            background: rgba(0, 0, 0, 0.05);
            color: #1e2b3c;
            border-color: #4a6a7f;
        }

        .btn-finish:hover {
            background: rgba(231, 76, 60, 0.15);
            border-color: #e74c3c;
            color: #c0392b;
        }

        /* ===== Финальный экран «Завершено» ===== */
        .finish-screen {
            text-align: center;
            color: #1e2b3c;
            padding: 2.5rem 2rem;
            background: rgba(44, 62, 80, 0.06);
            border-radius: 24px;
            border: 1px solid #3e5a6b;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
            max-width: 560px;
            width: 100%;
        }

        .finish-screen .emoji {
            font-size: 3.5rem;
            display: block;
            margin-bottom: 1rem;
        }

        .finish-screen h2 {
            font-weight: 400;
            font-size: 1.5rem;
            margin-bottom: 0.7rem;
        }

        .finish-screen p {
            color: #7f8c8d;
            font-size: 0.95rem;
        }

        .finish-screen .btn-retry {
            margin-top: 1.5rem;
        }

        .results-wrapper::-webkit-scrollbar {
            width: 6px;
        }

        .results-wrapper::-webkit-scrollbar-thumb {
            background: #bdc3c7;
            border-radius: 10px;
        }

        .question-text::-webkit-scrollbar {
            width: 4px;
        }

        .question-text::-webkit-scrollbar-thumb {
            background: #4a6a7f;
            border-radius: 10px;
        }

        @media (max-width: 700px) {
            table { font-size: 0.76rem; }
            th, td { padding: 0.6rem 0.5rem; }
            .col-result { width: 80px; }
            .results-summary { gap: 0.8rem; font-size: 0.85rem; }
            .action-btn { padding: 0.8rem 1.6rem; font-size: 0.9rem; }
        }

        @media (max-width: 480px) {
            .stage {
                height: 620px;
                max-width: 100%;
            }
            .card {
                padding: 1.2rem 1rem;
            }
            .question-text {
                font-size: 0.9rem;
                padding: 0.8rem 0.8rem 0.8rem 0.9rem;
            }
            .answer-btn {
                font-size: 0.8rem;
                padding: 0.7rem 0.8rem;
            }
            body {
                padding: 1rem 0.6rem;
            }
            .actions { flex-direction: column; }
            .action-btn { width: 100%; }
        }
    </style>
</head>
<body>

    <h1 id="mainTitle">Журнал учета аварий</h1>

    <div class="stage" id="stage"></div>

    <div class="progress" id="progress"></div>

    <script>
        // ============================================================
        // ДАННЫЕ КАРТОЧЕК — ВСЕ 13 ЗАПОЛНЕНЫ
        // ============================================================
        const cardsData = [
            {
                question: '№ п/п',
                answers: [
                    { text: '1', correct: true },
                    { text: '-', correct: false }
                ]
            },
            {
                question: 'Место аварии, название объекта, регистрационный номер и дата его регистрации',
                answers: [
                    { text: 'ООО "Груз", г. Владивосток, ул. Мира 6, участок хранения СУГ, Рег. № А12 05626-0001 02.07.2024', correct: true },
                    { text: 'ООО "Груз", г. Владивосток, ул. Индустриальная 6, ИНН 0567253853, ОГРН 0847264068', correct: false }
                ]
            },
            {
                question: 'Дата и время аварии',
                answers: [
                    { text: '10:00', correct: false },
                    { text: '02:00', correct: true }
                ]
            },
            {
                question: 'Вид аварии',
                answers: [
                    { text: 'Разрыв сварного шва емкости с частичным выбросом пропана', correct: true },
                    { text: 'Авария на ОПО', correct: false }
                ]
            },
            {
                question: 'Краткое описание возникновения, развития, ликвидации аварии, причины, какие пункты действующих норм и правил промышленной безопасности были нарушены',
                answers: [
                    { text: 'На участке хранения СУГ произошел разрыв сварного шва емкости с частичным выбросом пропана. Сработала автоматика, подача перекрыта, возгорания не было. Нарушение п. 8а Правил организации ПК № 2168', correct: true },
                    { text: 'Нарушение целостности емкости с пропаном, развитие аварии остановлено своими силами, подача газа перекрыта', correct: false }
                ]
            },
            {
                question: 'Наличие пострадавших',
                answers: [
                    { text: 'Нет', correct: true },
                    { text: 'Связь между пострадавшими и аварией не установлена', correct: false }
                ]
            },
            {
                question: 'Экономический ущерб от аварии, тыс. руб.',
                answers: [
                    { text: '950', correct: true },
                    { text: '950000', correct: false }
                ]
            },
            {
                question: 'Недоотпуск энергии, тыс. кВт·ч',
                answers: [
                    { text: '1200', correct: false },
                    { text: 'Нет', correct: true }
                ]
            },
            {
                question: 'Продолжительность простоя до пуска объекта в эксплуатацию, часов (суток)',
                answers: [
                    { text: '1 рабочий день', correct: false },
                    { text: '6 часов', correct: true }
                ]
            },
            {
                question: 'Лица, ответственные за допущенную аварию, и принятые к ним меры воздействия',
                answers: [
                    { text: 'Главный сварщик Иванов И.И. не проконтролировал, нарушение п. 14 производственной инструкции, объявлено предупреждение', correct: true },
                    { text: 'Не качественная работа проведенная подрядчиком в 2024 году', correct: false }
                ]
            },
            {
                question: 'Мероприятия, предложенные комиссией по техническому расследованию причин аварии',
                answers: [
                    { text: 'Мероприятия не нужны, т.к. обошлось без жертв, ставим "-"', correct: false },
                    { text: 'Провести внеочередной неразрушающий контроль всех емкостей участка', correct: true }
                ]
            },
            {
                question: 'Сведения о предоставлении информации в Ростехнадзор',
                answers: [
                    { text: 'Оперативное сообщение исх. № 200 от 02.07.2026. Материалы расследования исх. 275 от 04.08.2026', correct: true },
                    { text: 'Представлены', correct: false }
                ]
            },
            {
                question: 'Отметка о выполнении мероприятия',
                answers: [
                    { text: 'Выполнено', correct: true },
                    { text: 'Не выполнено в установленные сроки, ответственный уволен', correct: false }
                ]
            }
        ];

        // ============================================================
        // СОСТОЯНИЕ
        // ============================================================
        const stage = document.getElementById('stage');
        const progressEl = document.getElementById('progress');
        const mainTitle = document.getElementById('mainTitle');

        let currentIndex = 0;
        let isAnimating = false;
        let userResults = [];

        // ============================================================
        // ОПРЕДЕЛЕНИЕ ВЫСОТЫ СЦЕНЫ ПОД САМУЮ ЗАПОЛНЕННУЮ КАРТОЧКУ
        // ============================================================
        function computeStageHeight() {
            const probe = document.createElement('div');
            probe.style.cssText = `
                position: absolute;
                visibility: hidden;
                pointer-events: none;
                width: 560px;
                left: -9999px;
                top: 0;
                padding: 0;
                margin: 0;
            `;
            document.body.appendChild(probe);

            let maxContentHeight = 0;

            cardsData.forEach(data => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.position = 'static';
                card.style.height = 'auto';
                card.style.width = '100%';

                const questionEl = document.createElement('div');
                questionEl.className = 'question-text';
                questionEl.style.flex = '0 0 auto';
                questionEl.style.overflow = 'visible';
                questionEl.style.minHeight = '0';
                questionEl.textContent = data.question;
                card.appendChild(questionEl);

                const answersEl = document.createElement('div');
                answersEl.className = 'answers';

                data.answers.forEach(ans => {
                    const btn = document.createElement('button');
                    btn.className = 'answer-btn';
                    btn.type = 'button';
                    btn.textContent = ans.text;
                    answersEl.appendChild(btn);
                });

                card.appendChild(answersEl);
                probe.appendChild(card);

                const cardHeight = card.scrollHeight;
                if (cardHeight > maxContentHeight) {
                    maxContentHeight = cardHeight;
                }
            });

            document.body.removeChild(probe);

            return Math.ceil(maxContentHeight) + 4;
        }

        // ============================================================
        // СОЗДАНИЕ КАРТОЧКИ
        // ============================================================
        function createCardElement(data, index) {
            const card = document.createElement('div');
            card.className = 'card';

            const numberBadge = document.createElement('div');
            numberBadge.className = 'card-number';
            numberBadge.textContent = `#${index + 1} / ${cardsData.length}`;
            card.appendChild(numberBadge);

            const questionEl = document.createElement('div');
            questionEl.className = 'question-text';
            questionEl.textContent = data.question;
            card.appendChild(questionEl);

            const answersEl = document.createElement('div');
            answersEl.className = 'answers';

            const shuffled = shuffleArray(data.answers);

            shuffled.forEach(ans => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.textContent = ans.text;
                btn.dataset.correct = ans.correct;

                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    handleAnswer(btn, card, data);
                });

                answersEl.appendChild(btn);
            });

            card.appendChild(answersEl);

            return card;
        }

        function shuffleArray(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        // ============================================================
        // ОБРАБОТКА ОТВЕТА
        // ============================================================
        function handleAnswer(btn, card, data) {
            if (isAnimating) return;
            if (card.dataset.answered === 'true') return;
            card.dataset.answered = 'true';

            const isCorrect = btn.dataset.correct === 'true';
            const chosenText = btn.textContent;

            userResults.push({
                question: data.question,
                chosen: chosenText,
                isCorrect: isCorrect
            });

            if (isCorrect) {
                btn.classList.add('correct-flash');
            } else {
                btn.classList.add('wrong-flash');
            }

            card.querySelectorAll('.answer-btn').forEach(b => {
                b.disabled = true;
                b.style.pointerEvents = 'none';
            });

            const delay = isCorrect ? 350 : 550;

            setTimeout(() => {
                animateFlyOut(card);
            }, delay);
        }

        function animateFlyOut(card) {
            isAnimating = true;
            card.classList.add('fly-left');

            card.addEventListener('animationend', function onFlyEnd(e) {
                if (e.animationName !== 'flyLeft') return;
                card.removeEventListener('animationend', onFlyEnd);
                card.remove();

                currentIndex++;
                showNextCard();
            });
        }

        // ============================================================
        // ПОКАЗ СЛЕДУЮЩЕЙ КАРТОЧКИ
        // ============================================================
        function showNextCard() {
            if (currentIndex >= cardsData.length) {
                showResults();
                return;
            }

            const data = cardsData[currentIndex];
            const cardEl = createCardElement(data, currentIndex);

            cardEl.style.transform = 'translateX(140%)';
            cardEl.style.opacity = '0';

            stage.appendChild(cardEl);

            void cardEl.offsetWidth;

            cardEl.classList.add('slide-in');

            cardEl.addEventListener('animationend', function onSlideEnd(e) {
                if (e.animationName !== 'slideIn') return;
                cardEl.removeEventListener('animationend', onSlideEnd);
                cardEl.classList.remove('slide-in');
                cardEl.style.transform = '';
                cardEl.style.opacity = '';
                isAnimating = false;

                updateProgress();
            });

            updateProgress();
        }

        function updateProgress() {
            const total = cardsData.length;
            const shown = Math.min(currentIndex + 1, total);
            progressEl.textContent = `${shown} / ${total}`;
        }

        // ============================================================
        // ИТОГОВАЯ ТАБЛИЦА
        // ============================================================
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function showResults() {
            progressEl.classList.add('hidden');
            stage.style.display = 'none';
            mainTitle.textContent = 'Результаты прохождения';

            const total = userResults.length;
            const correctCount = userResults.filter(r => r.isCorrect).length;
            const wrongCount = total - correctCount;

            const wrapper = document.createElement('div');
            wrapper.className = 'results-wrapper';
            wrapper.id = 'resultsWrapper';

            const header = document.createElement('div');
            header.className = 'results-header';
            header.innerHTML = `
                <span class="emoji">📊</span>
                <h2>Итоги журнала учета аварий</h2>
                <div class="results-summary">
                    <span>Всего вопросов: <b>${total}</b></span>
                    <span class="good">Верно: <b>${correctCount}</b></span>
                    <span class="bad">Неверно: <b>${wrongCount}</b></span>
                </div>
            `;
            wrapper.appendChild(header);

            const table = document.createElement('table');
            table.innerHTML = `
                <thead>
                    <tr>
                        <th class="col-num">№</th>
                        <th>Вопрос</th>
                        <th>Ваш ответ</th>
                        <th class="col-result">Результат</th>
                    </tr>
                </thead>
            `;

            const tbody = document.createElement('tbody');

            userResults.forEach((r, i) => {
                const tr = document.createElement('tr');
                const chosenClass = r.isCorrect ? 'chosen-correct' : 'chosen-wrong';

                tr.innerHTML = `
                    <td class="col-num">${i + 1}</td>
                    <td>${escapeHtml(r.question)}</td>
                    <td class="${chosenClass}">${escapeHtml(r.chosen)}</td>
                    <td class="col-result">
                        <span class="badge ${r.isCorrect ? 'badge-ok' : 'badge-fail'}">
                            ${r.isCorrect ? 'Верно' : 'Неверно'}
                        </span>
                    </td>
                `;

                tbody.appendChild(tr);
            });

            table.appendChild(tbody);
            wrapper.appendChild(table);

            const hint = document.createElement('div');
            hint.className = 'scroll-hint';
            hint.textContent = '↑ ↓ — прокрутите таблицу, если она не помещается целиком';
            wrapper.appendChild(hint);

            const actions = document.createElement('div');
            actions.className = 'actions';

            const btnRetry = document.createElement('button');
            btnRetry.className = 'action-btn btn-retry';
            btnRetry.textContent = 'Пройти ещё раз';
            btnRetry.addEventListener('click', restartQuiz);
            actions.appendChild(btnRetry);

            const btnFinish = document.createElement('button');
            btnFinish.className = 'action-btn btn-finish';
            btnFinish.textContent = 'Завершить';
            btnFinish.addEventListener('click', finishQuiz);
            actions.appendChild(btnFinish);

            wrapper.appendChild(actions);

            document.body.appendChild(wrapper);
        }

        // ============================================================
        // ПЕРЕЗАПУСК
        // ============================================================
        function restartQuiz() {
            const wrapper = document.getElementById('resultsWrapper');
            if (wrapper) wrapper.remove();

            currentIndex = 0;
            userResults = [];
            isAnimating = false;

            stage.style.display = '';
            progressEl.classList.remove('hidden');
            mainTitle.textContent = 'Журнал учета аварий';

            stage.innerHTML = '';

            stage.style.height = computeStageHeight() + 'px';

            updateProgress();

            const data = cardsData[0];
            const cardEl = createCardElement(data, 0);

            cardEl.style.transform = 'translateX(140%)';
            cardEl.style.opacity = '0';
            stage.appendChild(cardEl);

            void cardEl.offsetWidth;

            cardEl.classList.add('slide-in');

            cardEl.addEventListener('animationend', function onFirstSlide(e) {
                if (e.animationName !== 'slideIn') return;
                cardEl.removeEventListener('animationend', onFirstSlide);
                cardEl.classList.remove('slide-in');
                cardEl.style.transform = '';
                cardEl.style.opacity = '';
                updateProgress();
            });
        }

        // ============================================================
        // ЗАВЕРШЕНИЕ
        // ============================================================
        function finishQuiz() {
            const wrapper = document.getElementById('resultsWrapper');
            if (wrapper) wrapper.remove();

            stage.style.display = 'none';
            progressEl.classList.add('hidden');
            mainTitle.textContent = 'Журнал учета аварий';

            const screen = document.createElement('div');
            screen.className = 'finish-screen';
            screen.innerHTML = `
                <span class="emoji">✅</span>
                <h2>Работа завершена</h2>
                <p>Спасибо за прохождение журнала учета аварий.</p>
            `;

            const btnRetry = document.createElement('button');
            btnRetry.className = 'action-btn btn-retry';
            btnRetry.textContent = 'Пройти ещё раз';
            btnRetry.addEventListener('click', () => {
                screen.remove();
                restartQuiz();
            });
            screen.appendChild(btnRetry);

            document.body.appendChild(screen);
        }

        // ============================================================
        // СТАРТ
        // ============================================================
        function start() {
            currentIndex = 0;
            userResults = [];

            stage.style.height = computeStageHeight() + 'px';

            updateProgress();

            if (cardsData.length === 0) {
                showResults();
                return;
            }

            const data = cardsData[0];
            const cardEl = createCardElement(data, 0);

            cardEl.style.transform = 'translateX(140%)';
            cardEl.style.opacity = '0';
            stage.appendChild(cardEl);

            void cardEl.offsetWidth;

            cardEl.classList.add('slide-in');

            cardEl.addEventListener('animationend', function onFirstSlide(e) {
                if (e.animationName !== 'slideIn') return;
                cardEl.removeEventListener('animationend', onFirstSlide);
                cardEl.classList.remove('slide-in');
                cardEl.style.transform = '';
                cardEl.style.opacity = '';

                updateProgress();
            });

            updateProgress();
        }

        start();

    </script>

</body>
</html>
